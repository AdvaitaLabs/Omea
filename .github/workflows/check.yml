name: CPU checks
on: [push, pull_request]
jobs:
  scientific-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/evaluation.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m compileall -q benchmark.py scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python benchmark.py models
